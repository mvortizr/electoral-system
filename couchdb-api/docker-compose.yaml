# docker-compose.yml
version: '3.8' # Versión de la especificación de Docker Compose

services:
  couchdb: # Define el primer servicio: tu base de datos CouchDB
    image: couchdb:latest # La imagen de Docker a usar
    container_name: my-couchdb # Un nombre más específico para el contenedor
    restart: unless-stopped # Reinicia automáticamente si se detiene inesperadamente
    ports:
      - "5984:5984" # Mapea el puerto 5984 de tu máquina al 5984 del contenedor
    environment: # Variables de entorno para configurar CouchDB
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: Cm97AfvnNK5&uY # ¡USA LA MISMA CONTRASEÑA QUE YA CONFIGURASTE!
    volumes: # Definición de volúmenes para persistir datos
      - couchdb-data:/opt/couchdb/data # Almacena los datos de CouchDB fuera del contenedor

  nestjs-api: # Define el segundo servicio: tu API NestJS
    build:
      context: . # El contexto para construir la imagen es el directorio actual (donde está el Dockerfile)
      dockerfile: Dockerfile # Usa el archivo Dockerfile que ya creaste
    container_name: my-nestjs-api-compose # Un nombre para el contenedor de la API
    restart: unless-stopped
    ports:
      - "3000:3000" # Mapea el puerto 3000 de tu máquina al 3000 del contenedor
    depends_on: # Asegura que CouchDB se inicie antes que la API NestJS
      - couchdb
    environment: # Variables de entorno para que la API se conecte a CouchDB
      # ¡Importante! Aquí usamos el nombre del servicio 'couchdb' como host.
      # Dentro de la red de Docker Compose, los servicios se ven por sus nombres.
      COUCHDB_HOST: my-couchdb
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: Cm97AfvnNK5&uY # ¡LA MISMA CONTRASEÑA!

volumes:
  couchdb-data: # Definición del volumen persistente para CouchDB