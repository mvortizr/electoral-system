# nestjs-api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-api-deployment
spec:
  replicas: 1 # Una copia de tu API por ahora.
  selector:
    matchLabels:
      app: nestjs-api
  template:
    metadata:
      labels:
        app: nestjs-api
    spec:
      containers:
        - name: nestjs-api
          # ¡IMPORTANTE! Aquí usamos la imagen de Docker que construiste en el Paso 13.
          # Asegúrate de que esta imagen esté disponible para tu clúster de Kubernetes.
          # Si usas MiniKube, después de `minikube start`, ejecuta `eval $(minikube docker-env)`
          # en tu terminal antes de hacer `docker build -t nestjs-couchdb-api .`
          imagePullPolicy: Never  # Add this line
          image: nestjs-couchdb-api:latest
          ports:
            - containerPort: 3000 # El puerto que NestJS expone
          env: # Variables de entorno para que NestJS se conecte a CouchDB
            - name: COUCHDB_HOST
              value: couchdb-service # ¡El nombre del Service de CouchDB dentro de Kubernetes!
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-creds
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-creds
                  key: password